# =============================================================================
# SysMetrics Pro — Nightly Pipeline
# =============================================================================
# Triggers: manual dispatch ONLY (no cron — run when needed, not automatically)
# Jobs: Unit Tests → Instrumented Tests → Benchmarks → Dependency Check → Build → Cleanup
# =============================================================================

name: Nightly

on:
  workflow_dispatch:

# Only one nightly run at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true
    -Dorg.gradle.jvmargs=-Xmx4g
  JAVA_VERSION: '17'
  NDK_VERSION: '27.2.12479018'

jobs:
  # ---------------------------------------------------------------------------
  # Unit Tests
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;${{ env.NDK_VERSION }}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Instrumented Tests (API 28 / default target — most stable on GitHub runners)
  # ---------------------------------------------------------------------------
  instrumented-tests:
    name: Instrumented Tests (API 28)
    runs-on: ubuntu-latest
    needs: [ unit-tests ]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;${{ env.NDK_VERSION }}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-28-default-x86

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: echo "AVD snapshot created"

      - name: Run instrumented tests
        id: run-tests
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 25
        with:
          api-level: 28
          target: default
          arch: x86
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 2; done; input keyevent 82'
            ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Retry on failure
        if: steps.run-tests.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 25
        with:
          api-level: 28
          target: default
          arch: x86
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 2; done; input keyevent 82'
            ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-instrumented-test-results
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Performance Benchmarks
  # ---------------------------------------------------------------------------
  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;${{ env.NDK_VERSION }}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run benchmarks
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 25
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 2; done; input keyevent 82'
            ./gradlew :app:connectedBenchmarkAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.package=com.sysmetrics.app.benchmark \
              --stacktrace

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            app/build/outputs/connected_android_test_additional_output/
            app/build/reports/androidTests/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Dependency Check
  # ---------------------------------------------------------------------------
  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;${{ env.NDK_VERSION }}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check dependencies
        run: ./gradlew :app:dependencies --configuration releaseRuntimeClasspath > dependency-report.txt 2>&1

      - name: Validate build with current deps
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: dependency-report.txt
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Nightly Build
  # ---------------------------------------------------------------------------
  nightly-build:
    name: Nightly Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ instrumented-tests ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;${{ env.NDK_VERSION }}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify native libraries
        run: |
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            if unzip -l app/build/outputs/apk/debug/*.apk \
                | grep -q "lib/${abi}/libsysmetrics_native.so"; then
              echo "✓ ${abi}: libsysmetrics_native.so found"
            else
              echo "✗ ${abi}: libsysmetrics_native.so MISSING" && exit 1
            fi
          done

      - name: Upload nightly APK
        uses: actions/upload-artifact@v4
        with:
          name: nightly-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Cleanup — always runs at the end, removes old nightly runs & artifacts
  # ---------------------------------------------------------------------------
  cleanup:
    name: Cleanup Old Nightly Runs & Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ unit-tests, instrumented-tests, benchmarks, dependency-check, nightly-build ]
    if: always()
    permissions:
      actions: write

    steps:
      - name: Delete old nightly workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          echo "=== Deleting old nightly runs ==="
          DELETED=0
          PAGE=1
          while true; do
            RESPONSE=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/nightly.yml/runs?per_page=100&page=$PAGE&status=completed")

            RUN_IDS=$(echo "$RESPONSE" | jq -r \
              --arg current "$CURRENT_RUN" \
              '.workflow_runs[] | select(.id | tostring != $current) | .id')

            [ -z "$RUN_IDS" ] && break

            for RUN_ID in $RUN_IDS; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID")
              [ "$STATUS" = "204" ] && { echo "  ✓ Deleted run $RUN_ID"; DELETED=$((DELETED+1)); }
            done

            TOTAL=$(echo "$RESPONSE" | jq '.total_count')
            [ "$TOTAL" -le 100 ] && break
            PAGE=$((PAGE + 1))
          done
          echo "=== Deleted $DELETED old nightly run(s) ==="

      - name: Delete old artifacts from previous nightly runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          echo "=== Collecting run IDs that belong to nightly.yml ==="
          # The /actions/artifacts endpoint is repo-wide, not workflow-scoped — without
          # this allow-list, this step would delete other workflows' artifacts too.
          ALLOWED_RUNS="[]"
          PAGE=1
          while true; do
            RESPONSE=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/nightly.yml/runs?per_page=100&page=$PAGE")
            PAGE_IDS=$(echo "$RESPONSE" | jq -c '[.workflow_runs[].id]')
            ALLOWED_RUNS=$(jq -c -n --argjson a "$ALLOWED_RUNS" --argjson b "$PAGE_IDS" '$a + $b')
            [ "$(echo "$PAGE_IDS" | jq 'length')" -eq 0 ] && break
            TOTAL=$(echo "$RESPONSE" | jq '.total_count')
            [ "$((PAGE * 100))" -ge "$TOTAL" ] && break
            PAGE=$((PAGE + 1))
          done
          echo "nightly.yml owns $(echo "$ALLOWED_RUNS" | jq 'length') run(s)"

          echo "=== Deleting artifacts from previous runs ==="
          DELETED=0
          PAGE=1
          while true; do
            RESPONSE=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/artifacts?per_page=100&page=$PAGE")

            ART_IDS=$(echo "$RESPONSE" | jq -r \
              --arg current "$CURRENT_RUN" --argjson allowed "$ALLOWED_RUNS" \
              '.artifacts[] | select((.workflow_run.id | tostring != $current) and ([.workflow_run.id] - $allowed | length == 0)) | .id')

            [ -z "$ART_IDS" ] && break

            for ART_ID in $ART_IDS; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/actions/artifacts/$ART_ID")
              [ "$STATUS" = "204" ] && { echo "  ✓ Deleted artifact $ART_ID"; DELETED=$((DELETED+1)); }
            done

            TOTAL=$(echo "$RESPONSE" | jq '.total_count')
            [ "$TOTAL" -le 100 ] && break
            PAGE=$((PAGE + 1))
          done
          echo "=== Deleted $DELETED old artifact(s) ==="
