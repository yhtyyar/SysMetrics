# =============================================================================
# SysMetrics Pro — Android CI/CD Pipeline
# =============================================================================
# Triggers: push/PR to main ONLY
# Jobs: Lint → Unit Tests → Build → Cleanup
#
# Design decisions:
# - Single API level (no matrix) to keep run time predictable
# - concurrency: cancel-in-progress on same branch/PR
# - retention-days: 1 for all intermediate artifacts (only current run matters)
# - cleanup job: purges old runs & artifacts after every successful build
# - Instrumented emulator jobs disabled: google_apis images crash on
#   GitHub-hosted runners; re-enable when self-hosted runners are available
# =============================================================================

name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel any previous run on the same branch/PR to avoid wasting minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true
    -Dorg.gradle.jvmargs=-Xmx4g
  JAVA_VERSION: '17'
  NDK_VERSION: '25.2.9519653'

jobs:
  # ---------------------------------------------------------------------------
  # Lint & Static Analysis
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;${{ env.NDK_VERSION }}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Unit Tests
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;${{ env.NDK_VERSION }}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Build Debug APK
  # Runs only if both lint and unit tests pass
  # ---------------------------------------------------------------------------
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ lint, unit-tests ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;${{ env.NDK_VERSION }}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify native libraries for all ABIs
        run: |
          echo "=== Verifying native libraries in APK ==="
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            if unzip -l app/build/outputs/apk/debug/*.apk \
                | grep -q "lib/${abi}/libsysmetrics_native.so"; then
              echo "✓ ${abi}: libsysmetrics_native.so found"
            else
              echo "✗ ${abi}: libsysmetrics_native.so MISSING" && exit 1
            fi
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Cleanup — runs after every build (success or failure on build, not on lint/test)
  # Deletes old workflow runs and artifacts; keeps only the current run.
  # Requires actions: write permission.
  # ---------------------------------------------------------------------------
  cleanup:
    name: Cleanup Old Runs & Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ lint, unit-tests, build-debug ]
    if: always()
    permissions:
      actions: write

    steps:
      - name: Delete old workflow runs (keep current)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          echo "=== Deleting completed runs for workflow: $WORKFLOW ==="

          PAGE=1
          DELETED=0

          while true; do
            RESPONSE=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/android-ci.yml/runs?per_page=100&page=$PAGE&status=completed")

            RUN_IDS=$(echo "$RESPONSE" | jq -r \
              --arg current "$CURRENT_RUN" \
              '.workflow_runs[] | select(.id | tostring != $current) | .id')

            [ -z "$RUN_IDS" ] && break

            for RUN_ID in $RUN_IDS; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID")
              if [ "$STATUS" = "204" ]; then
                echo "  ✓ Deleted run $RUN_ID"
                DELETED=$((DELETED + 1))
              fi
            done

            TOTAL=$(echo "$RESPONSE" | jq '.total_count')
            [ "$TOTAL" -le 100 ] && break
            PAGE=$((PAGE + 1))
          done

          echo "=== Deleted $DELETED old run(s) ==="

      - name: Delete old artifacts (keep current run's artifacts)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          echo "=== Deleting artifacts from previous runs ==="

          DELETED=0
          PAGE=1

          while true; do
            RESPONSE=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/artifacts?per_page=100&page=$PAGE")

            ARTIFACT_IDS=$(echo "$RESPONSE" | jq -r \
              --arg current "$CURRENT_RUN" \
              '.artifacts[] | select(.workflow_run.id | tostring != $current) | .id')

            [ -z "$ARTIFACT_IDS" ] && break

            for ART_ID in $ARTIFACT_IDS; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/actions/artifacts/$ART_ID")
              if [ "$STATUS" = "204" ]; then
                echo "  ✓ Deleted artifact $ART_ID"
                DELETED=$((DELETED + 1))
              fi
            done

            TOTAL=$(echo "$RESPONSE" | jq '.total_count')
            [ "$TOTAL" -le 100 ] && break
            PAGE=$((PAGE + 1))
          done

          echo "=== Deleted $DELETED old artifact(s) ==="
